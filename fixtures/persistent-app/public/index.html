<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeProof Fixture</title><style>body{font-family:system-ui;max-width:720px;margin:4rem auto;padding:0 1rem}form{display:grid;gap:.75rem}input,button{font:inherit;padding:.75rem}#status{min-height:1.5rem;font-weight:700}</style></head><body><h1>Persistent product proof</h1><p id="current">Loading state...</p><form id="item-form"><label>Title <input id="title" name="title" autocomplete="off"></label><button id="save" type="submit">Save</button></form><p id="status" role="status"></p><script>const current=document.querySelector('#current');const status=document.querySelector('#status');async function load(){const state=await fetch('/api/item').then(r=>r.json());current.textContent=state.title?`Current: ${state.title}`:'No saved item'}document.querySelector('#item-form').addEventListener('submit',async(event)=>{event.preventDefault();const title=document.querySelector('#title').value;const response=await fetch('/api/item',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title})});const state=await response.json();status.textContent=response.ok?`Saved: ${state.title}`:`Error: ${state.error}`;await load()});load()</script></body></html>
