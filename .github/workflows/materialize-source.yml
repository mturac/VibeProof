name: Materialize source

on:
  push:
    branches: [feat/vibeproof-core]
    paths:
      - ".bootstrap/source.tar.gz.b64"
      - ".github/workflows/materialize-source.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/vibeproof-core
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/source.tar.gz.b64 > /tmp/vibeproof.tar.gz
          echo "7c6df5c3afe0d73b3bd97f73419298f75af9b8e7207a845653520643ff693f34  /tmp/vibeproof.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/vibeproof.tar.gz > /tmp/vibeproof-files.txt
          grep -Fxq './package.json' /tmp/vibeproof-files.txt
          grep -Fxq './src/verify.ts' /tmp/vibeproof-files.txt
          grep -Fxq './README.md' /tmp/vibeproof-files.txt

      - name: Materialize repository source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/materialize-source.yml /tmp/materialize-source.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/vibeproof.tar.gz -C .
          rm -f .github/workflows/ci.yml
          mkdir -p .github/workflows
          cp /tmp/materialize-source.yml .github/workflows/materialize-source.yml
          test -f package.json
          test -f src/verify.ts
          test -f README.md
          chmod +x bin/vibeproof.mjs

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add running-product verification"
          git push origin HEAD:feat/vibeproof-core
