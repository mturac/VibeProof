name: Bug report
description: Report a reproducible false result or proof failure.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    attributes: { label: Actual behavior and redacted evidence }
    validations: { required: true }
  - type: input
    attributes: { label: VibeProof and Node versions }
    validations: { required: true }
